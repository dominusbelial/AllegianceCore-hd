# HD texture ESRGAN worker on the mini (Claude 2026-10-18). Inputs are synced from the workstation; outputs are
# pulled back. Settings in .env.
services:
  esrgan:
    build: .
    image: allegiance-hd-esrgan:latest
    restart: unless-stopped
    pid: host
    # Run as the host user so outputs stay editable on the host.
    user: "${RUNNER_UID:-1000}:${RUNNER_GID:-1000}"
    environment:
      HD_ADDON_ROOT: /work
      HOME: /tmp
      ESRGAN_WEIGHTS: /weights/RealESRGAN_x4plus.pth
      OMP_NUM_THREADS: ${THREADS:-12}
      MKL_NUM_THREADS: ${THREADS:-12}
      PAUSE_FOR_RUNNER: ${PAUSE_FOR_RUNNER:-1}
      NICE: ${NICE:-10}
      TZ: ${TZ:-America/Bogota}
    volumes:
      - ${WORK_PATH}:/work
      - ${WEIGHTS_DIR}:/weights:ro
